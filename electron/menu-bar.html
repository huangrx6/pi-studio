<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Studio</title>
    <link rel="stylesheet" href="../web/src/styles/palette.css">
    <link rel="stylesheet" href="../web/src/styles/tokens.css">
    <link rel="stylesheet" href="./menu-bar.css">
    <script src="./menu-bar-renderer.js" defer></script>
  </head>
  <body>
    <div class="popover-shell">
      <div class="popover-panel">
        <header class="popover-header">
          <div class="brand-lockup">
            <img class="brand-mark" src="../assets/icon.png" alt="" draggable="false">
            <strong>Pi Studio</strong>
          </div>
          <div class="more-anchor">
            <button id="more" class="icon-button" type="button" aria-label="更多操作" title="更多操作" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
            </button>
            <div id="more-menu" class="more-menu" role="menu" hidden>
              <button id="settings" type="button" role="menuitem">设置…</button>
              <button id="check-updates" type="button" role="menuitem">检查更新…</button>
              <button id="clear-recent" type="button" role="menuitem">清除最近记录</button>
              <span class="menu-separator" aria-hidden="true"></span>
              <button id="quit" class="is-danger" type="button" role="menuitem">退出 Pi Studio</button>
            </div>
          </div>
        </header>
        <main class="popover-content">
          <section class="menu-section is-attention" id="attention-section" aria-labelledby="attention-heading" hidden>
            <h2 id="attention-heading">需处理</h2>
            <div id="attention-list" class="session-list"></div>
          </section>
          <section class="menu-section" id="running-section" aria-labelledby="running-heading" hidden>
            <h2 id="running-heading">运行中</h2>
            <div id="running-list" class="session-list"></div>
          </section>
          <section class="menu-section" id="recent-section" aria-labelledby="recent-heading" hidden>
            <h2 id="recent-heading">最近结束</h2>
            <div id="recent-list" class="session-list"></div>
          </section>
          <div id="empty" class="empty-state">暂无运行任务</div>
        </main>
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
        <footer class="popover-footer">
          <button id="open-main" class="open-main" type="button">
            <span>打开 Pi Studio</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </footer>
      </div>
    </div>
  </body>
</html>
