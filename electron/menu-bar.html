<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Studio</title>
    <link rel="stylesheet" href="../web/src/styles/palette.css">
    <link rel="stylesheet" href="../web/src/styles/tokens.css">
    <link rel="stylesheet" href="./menu-bar.css">
    <script src="./menu-bar-renderer.js" defer></script>
  </head>
  <body>
    <div class="popover-shell">
      <div class="popover-panel">
        <header class="popover-header">
          <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">π</span><strong>Pi Studio</strong><span class="header-label">后台会话</span></div>
          <button id="close" class="icon-button" type="button" aria-label="关闭菜单栏面板" title="关闭">×</button>
        </header>
        <p id="summary" class="summary" aria-live="polite">正在读取后台状态…</p>
        <main class="popover-content">
          <section class="menu-section" id="running-section" aria-labelledby="running-heading" hidden>
            <div class="section-heading"><h2 id="running-heading">运行中 <span id="running-count">0</span></h2></div>
            <div id="running-list" class="card-list"></div>
          </section>
          <section class="menu-section" id="recent-section" aria-labelledby="recent-heading" hidden>
            <div class="section-heading"><h2 id="recent-heading">最近结束</h2><button id="clear-recent" class="text-button" type="button" title="仅清除此处的完成记录，不删除会话">清除记录</button></div>
            <div id="recent-list" class="card-list"></div>
          </section>
        </main>
        <footer class="popover-footer">
          <button id="quit" class="text-button" type="button" title="退出应用并停止后台运行">退出应用</button>
          <button id="open-main" class="primary-button" type="button">打开 Pi Studio <span aria-hidden="true">↗</span></button>
        </footer>
      </div>
    </div>
  </body>
</html>
