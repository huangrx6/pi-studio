<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Studio</title>
    <script src="/launch-appearance.js"></script>
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/palette.css" />
    <link rel="stylesheet" href="./src/shared/styles/pi-mark.css" />
    <link rel="stylesheet" href="./src/shell/styles/launch-screen.css" />
  </head>
  <body>
    <section id="launch-screen" class="launch-screen" role="status" aria-label="正在启动">
      <div class="launch-mark" aria-hidden="true">
        <span class="launch-symbol">
          <span class="launch-strokes pi-mark">
            <span class="launch-beam"></span>
            <span class="launch-leg-left"></span>
            <span class="launch-leg-right"></span>
          </span>
          <span class="launch-cursor pi-mark"></span>
        </span>
        <span class="launch-wordmark">Pi Studio</span>
      </div>
    </section>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
