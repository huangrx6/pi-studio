name: Release

# Publish both platforms together, or attach Windows assets to an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: true
      windows_only:
        description: "Add Windows x64 downloads to an existing release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    if: ${{ !inputs.windows_only }}
    name: Build macOS (arm64 + x64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      # node-pty is rebuilt for Electron during packaging. Its node-gyp 9
      # toolchain imports distutils, which Python 3.12+ no longer ships.
      - name: Setup Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify native build toolchain
        run: python -c "import distutils.version"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Check release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate extension schema and official extension
        run: |
          pnpm run extension:schema
          pnpm run extension validate examples/extensions/agent-starter --scope user --json
          pnpm run extension validate extensions/pi-project-scripts --scope user --json

      - name: Validate macOS signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD must contain the stable self-signed macOS signing certificate."
            exit 1
          fi
          certificate="$RUNNER_TEMP/pi-studio-signing.p12"
          password_file="$RUNNER_TEMP/pi-studio-signing-password.txt"
          printf '%s' "${CSC_LINK#*base64,}" \
            | tr -d '\r\n\t ' \
            | openssl base64 -d -A -out "$certificate"
          printf '%s' "$CSC_KEY_PASSWORD" \
            | tr -d '\r\n' \
            > "$password_file"
          chmod 600 "$certificate" "$password_file"
          if [ ! -s "$certificate" ] || [ ! -s "$password_file" ]; then
            echo "::error::The macOS signing secrets could not be decoded."
            exit 1
          fi
          echo "Decoded macOS signing certificate: $(stat -f '%z' "$certificate") bytes."
          echo "PI_STUDIO_SIGNING_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          echo "PI_STUDIO_SIGNING_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"

      - name: Build & package (DMG + auto-update ZIP)
        shell: bash
        env:
          npm_config_python: python3
        run: pnpm release:dist

      - name: Packaged startup regression
        run: pnpm run qa:startup

      - name: Packaged vi interaction regression
        shell: bash
        run: |
          app_dir=mac
          if [ "$(uname -m)" = arm64 ]; then app_dir=mac-arm64; fi
          qa_dir=$(node -p 'require("node:path").dirname(require("./package.json").scripts["qa:startup"].split(" ").at(-1))')
          PI_STUDIO_PACKAGED_APP="$PWD/release/$app_dir/Pi Studio.app/Contents/MacOS/Pi Studio" node "$qa_dir/qa-terminal-vi.mjs"

      - name: Collect installers and updater metadata
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pi-studio-macos
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

  build-windows:
    name: Build and install on Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Preserve signed extension file contents at checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      - name: Use current packaging tools with the tagged application
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git restore --source="$GITHUB_SHA" --worktree -- scripts/release scripts/qa/qa-windows-installer.mjs
          # Older tags keep their own package.json and script paths. Install the
          # current release tooling at the path declared by that tagged app.
          tagged_release_dir=$(node -p 'require("node:path").dirname(require("./package.json").build.afterPack)')
          if [ "$tagged_release_dir" != scripts/release ]; then
            mkdir -p "$tagged_release_dir"
            cp -R scripts/release/. "$tagged_release_dir/"
          fi

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"

      - run: pnpm install --frozen-lockfile
      - name: Apply Windows packaging fixes when rebuilding an older tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # Keep the application's tagged lockfile. Apply the same builder patch
          # as a fresh install on main if the tagged lockfile predates that fix.
          builder=$(node -e '
            const electronBuilder = require("node:module").createRequire(require.resolve("electron-builder/package.json"));
            const path = require("node:path");
            const dir = path.dirname(electronBuilder.resolve("app-builder-lib/package.json"));
            console.log(path.relative(process.cwd(), dir).split(path.sep).join("/"));
          ')
          version=$(node -p 'require(process.argv[1]).version' "./$builder/package.json")
          patch="scripts/release/patches/app-builder-lib@$version.patch"
          if [[ -f "$patch" ]] && ! git apply --directory="$builder" --reverse --check "$patch" 2>/dev/null; then
            git apply --directory="$builder" "$patch"
          fi
      - run: pnpm run extension validate extensions/pi-project-scripts --scope user --json
      - name: Build Windows installer
        run: pnpm dist

      - name: Install the release and exercise its desktop and terminal
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/Pi-Studio-$version-Windows-x64-Setup.exe"
          $target = Join-Path $env:RUNNER_TEMP 'pi-studio-installed'
          $started = Get-Date
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=$started} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like "*$($installer.Name)*" } |
              Select-Object -First 4 -ExpandProperty Message | Write-Host
            throw ('Installer exited with {0} (0x{0:X8})' -f $process.ExitCode)
          }
          node scripts/qa/qa-windows-installer.mjs "$target/Pi Studio.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: pi-studio-windows-x64
          path: |
            release/*-Windows-x64-Setup.exe
            release/*-Windows-x64-Setup.exe.blockmap
            release/latest.yml
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish verified installers
    needs: [build-macos, build-windows]
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && (needs.build-macos.result == 'success' || (inputs.windows_only && needs.build-macos.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ !inputs.windows_only }}
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pi-studio-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows downloads to the existing release
        if: inputs.windows_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/*-Windows-x64-Setup.exe{,.blockmap} --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" artifacts/latest.yml --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published tag and select release notes
        id: release-notes
        if: ${{ !inputs.windows_only }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            echo "body_path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.windows_only }}
        uses: softprops/action-gh-release@v2
        with:
          # The existing tag determines the release commit. GitHub separately
          # checks workflow-write access if target_commitish names an old workflow.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event.repository.default_branch }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release-notes.outputs.body_path == '' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/*
