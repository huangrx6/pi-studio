packages:
  - '.'
# Local macOS releases build both Intel and Apple Silicon bundles.
supportedArchitectures:
  cpu: [current, arm64, x64]
# Use the bounded binary probe when macOS signing inspects bundled resources.
overrides:
  '@electron/osx-sign@1.3.1>isbinaryfile': 5.0.7
# Skip the Win7-only folder lookup on Studio's supported Windows versions.
# Upstream fix: electron-userland/electron-builder#9564.
patchedDependencies:
  app-builder-lib@25.1.8: scripts/release/patches/app-builder-lib@25.1.8.patch
allowBuilds:
  electron: true
  '@google/genai': true
  esbuild: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.5.2'
  - '@earendil-works/pi-ai@1.5.2'
  - '@earendil-works/pi-codemode@1.5.2'
  - '@earendil-works/pi-durable@1.5.2'
  - '@earendil-works/pi-mcp@1.5.2'
  - '@earendil-works/pi-schema@1.5.2'
  - '@earendil-works/pi-telemetry@1.5.2'
